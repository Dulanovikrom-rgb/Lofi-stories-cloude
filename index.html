<style>

<div id="start"><h1>Бухара</h1><p>Ночь, дождь над минаретом Калян. Музыку сочиняет сам сайт, каждый раз новую.</p><button id="go">Включить</button></div>
<script>
/* Генератор лоу-фай на Web Audio. Без сэмплов, всё синтезируется. */
(function (root) {
  'use strict';

  var PROGS = [
    { n: 'ii–V–I–vi',  c: [[2, 'm7'], [7, '7'], [0, 'maj7'], [9, 'm7']], tonic: 0 },
    { n: 'I–vi–ii–V',  c: [[0, 'maj7'], [9, 'm7'], [2, 'm7'], [7, '7']], tonic: 0 },
    { n: 'vi–ii–V–I',  c: [[9, 'm7'], [2, 'm7'], [7, '7'], [0, 'maj7']], tonic: 0 },
    { n: 'IV–iii–vi–ii', c: [[5, 'maj7'], [4, 'm7'], [9, 'm7'], [2, 'm7']], tonic: 0 },
    { n: 'I–iii–IV–V', c: [[0, 'maj7'], [4, 'm7'], [5, 'maj7'], [7, '7']], tonic: 0 }
  ];

  var KEYNAMES = { 0: 'C', 2: 'D', 3: 'Eb', 5: 'F', 7: 'G', 8: 'Ab', 10: 'Bb' };

  var W2 = ['kalyan', 'lyabi-hauz', 'the old city', 'chor-minor', 'the ark', 'toki zargaron', 'mir-i-arab', 'the bazaar'];

  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  function Engine(ctx, opts) {
    opts = opts || {};
    this.ctx = ctx;
    this.onTrack = opts.onTrack || function () {};
    this.t = null;
    this.running = false;
    this.step = 0;
    this.nextTime = 0;
    this.build();
  }

  Engine.prototype.build = function () {
    var ctx = this.ctx, sr = ctx.sampleRate;

    for (i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    for (ch = 0; ch < 2; ch++) {

    this.lofi = ctx.createBiquadFilter(); this.lofi.type = 'lowpass'; this.lofi.frequency.value = 7200; this.lofi.Q.value = 0.5;
    this.comp = ctx.createDynamicsCompressor();

    this.master = ctx.createGain(); this.master.gain.value = 0.5;
    this.bus.connect(this.lofi); this.lofi.connect(this.comp); this.comp.connect(this.master); this.lim = ctx.createDynamicsCompressor(); this.lim.threshold.value = -4; this.lim.knee.value = 0; this.lim.ratio.value = 20; this.lim.attack.value = 0.002; this.lim.release.value = 0.1; this.master.connect(this.lim); this.lim.connect(ctx.destination);

    this.wobG = ctx.createGain(); this.wobG.gain.value = 7;

    for (i = 0; i < cl; i++) cd[i] = (Math.random() * 2 - 1) * 0.012;

    var rbp = ctx.createBiquadFilter(); rbp.type = 'bandpass'; rbp.frequency.value = 3200; rbp.Q.value = 0.35;

    this.rain.connect(rbp); rbp.connect(rhp); rhp.connect(this.rainG); this.rainG.connect(this.lofi);

    this.rain2G = ctx.createGain(); this.rain2G.gain.value = 0.05;
    this.rain2.connect(r2); r2.connect(this.rain2G); this.rain2G.connect(this.lofi);
    this.rain.start(); this.rain2.start();
  };

  Engine.prototype.setRain = function (v) { // 0..1
    var t = this.ctx.currentTime;
    this.rainG.gain.setTargetAtTime(0.13 * v, t, 0.2);
    this.rain2G.gain.setTargetAtTime(0.09 * v, t, 0.2);
  };
  Engine.prototype.setVolume = function (v) { this.master.gain.setTargetAtTime(0.55 * v, this.ctx.currentTime, 0.1); };

  /* ---------- голоса ---------- */
  Engine.prototype.env = function (g, t, a, vel, dur, tc) {
    g.gain.setValueAtTime(0.0001, t);

  };
  Engine.prototype.osc = function (type, f, t, stop, dest) {

  };
  Engine.prototype.rhodes = function (t, m, dur, vel, out) {

    var tine = ctx.createGain(); tine.gain.value = 0.25;

    var o3 = this.osc('triangle', f, t, t + dur + 0.6, tine);

    g.connect(lp); lp.connect(out); lp.connect(this.verb);
  };
  Engine.prototype.pluck = function (t, m, dur, vel, out) {

    var s = ctx.createGain(); s.gain.value = 0.35; this.osc('sine', f * 2, t, t + dur + 0.5, s); s.connect(g);

    g.connect(lp); lp.connect(out); var sd = ctx.createGain(); sd.gain.value = 0.55; lp.connect(sd); sd.connect(this.verb);
  };
  Engine.prototype.bassNote = function (t, m, dur, vel, out) {
    var ctx = this.ctx, g = ctx.createGain(), lp = ctx.createBiquadFilter(), f = mtof(m);
    lp.type = 'lowpass'; lp.frequency.value = 420;
    this.osc('sine', f, t, t + dur + 0.3, g);
    var s = ctx.createGain(); s.gain.value = 0.25; this.osc('triangle', f, t, t + dur + 0.3, s); s.connect(g);
    this.env(g, t, 0.012, vel, dur, dur / 3);
    g.connect(lp); lp.connect(out);
  };
  Engine.prototype.kick = function (t, vel, out) {
    var ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
    g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.4);
  };
  Engine.prototype.snare = function (t, vel, out) {
    var ctx = this.ctx, n = ctx.createBufferSource(), g = ctx.createGain(), bp = ctx.createBiquadFilter();
    n.buffer = this.noise; bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 0.7;
    g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    n.connect(bp); bp.connect(g); g.connect(out); n.start(t, Math.random()); n.stop(t + 0.22);
    var o = ctx.createOscillator(), og = ctx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
    og.gain.setValueAtTime(vel * 0.5, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    o.connect(og); og.connect(out); o.start(t); o.stop(t + 0.12);
    var sd = ctx.createGain(); sd.gain.value = 0.3; g.connect(sd); sd.connect(this.verb);
  };
  Engine.prototype.hat = function (t, vel, out) {
    var ctx = this.ctx, n = ctx.createBufferSource(), g = ctx.createGain(), hp = ctx.createBiquadFilter();
    n.buffer = this.noise; hp.type = 'highpass'; hp.frequency.value = 7500;
    g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    n.connect(hp); hp.connect(g); g.connect(out); n.start(t, Math.random()); n.stop(t + 0.07);
  };

  /* ---------- трек ---------- */
  Engine.prototype.newTrack = function (startTime) {
    var ctx = this.ctx, key = pick(KEYS), prog = pick(PROGS), bpm = Math.round(rnd(70, 88));
    var barDur = 60 / bpm * 4, len = Math.max(36, Math.round(rnd(150, 200) / barDur));
    var t = {
      key: key, prog: prog, bpm: bpm, barDur: barDur, len: len, bar: 0, start: startTime,
      name: pick(W1) + ' ' + pick(W2), swing: rnd(0.28, 0.42),
      scale: [0, 2, 4, 7, 9], mel: [], melIdx: 4, breakAt: Math.round(len * 0.55),
      g: ctx.createGain(), dry: null, kickPat: pick([[0, 10], [0, 7, 10], [0, 6, 10, 15]]),
      hatVar: Math.random() < 0.5
    };
    t.g.gain.setValueAtTime(0.0001, startTime);
    t.g.gain.linearRampToValueAtTime(1, startTime + 5);
    t.g.connect(this.bus);

    var dl = ctx.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 8800;
    t.drums.connect(dl); dl.connect(t.g);

    t.bass = ctx.createGain(); t.bass.gain.value = 0.85; t.bass.connect(t.g);

    this.t = this.newTrack(t0);
    this.step = 0;
    this.nextTime = t0;
    this.running = true;

  };

        notes.push({ s: st, i: tr.melIdx, d: pick([0.5, 0.9, 1.4]) });

      tr.bar = bar;
    }

      var nt = this.newTrack(time);
      this.t = nt; this.step = 0; tr = nt; stepInBar = 0; bar = 0;

      if (stepInBar === 14 && Math.random() < 0.3) this.bassNote(t, bm + 12, barDur * 0.1, 0.35, tr.bass);

<script>
/* Сцена «Бухара»: рисуется кодом на холсте 480x270 и увеличивается без сглаживания */
(function (root) {
  'use strict';
  var W = 480, H = 270;
  function rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

<script>
(function () {
  var cv = document.getElementById('c'), scene = new BukharaScene(cv);
  var ctx = null, eng = null, last = 0, playing = false, tmr = null;
  var titleEl = document.getElementById('title'), subEl = document.getElementById('sub');
  var music = { beat: 0 };
  function show(tr, t0) {

    setTimeout(function () { titleEl.textContent = '♪ ' + tr.name; subEl.textContent = tr.label; }, wait);
  }
  function frame(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
    scene.rainAmt = 0.15 + document.getElementById('rn').value / 100 * 0.85;

  }
  requestAnimationFrame(frame);

    if (ctx) return;

    eng = new LofiEngine(ctx, { onTrack: show });
    eng.setVolume(document.getElementById('vol').value / 100);
    eng.setRain(document.getElementById('rn').value / 100);
    eng.start();
    tmr = setInterval(function () { if (ctx.state === 'running') eng.pump(); }, 40);
    playing = true;
  }
  document.getElementById('go').addEventListener('click', function () {
    document.getElementById('start').style.display = 'none';
    begin(); if (ctx.state === 'suspended') ctx.resume();
  });

    if (!ctx) return;
    if (ctx.state === 'running') { ctx.suspend(); this.textContent = '▶'; }
    else { ctx.resume(); this.textContent = '❚❚'; }
  });
  document.getElementById('nx').addEventListener('click', function () { if (eng) eng.nextTrack(); });
  document.getElementById('vol').addEventListener('input', function () { if (eng) eng.setVolume(this.value / 100); });
  document.getElementById('rn').addEventListener('input', function () { if (eng) eng.setRain(this.value / 100); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) return; if (ctx && ctx.state === 'interrupted') ctx.resume(); });
